<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BAKO" />
<meta name="theme-color" content="#111111" />
<title>BAKO Athlete</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23111'/><rect x='32' y='28' width='80' height='6' fill='%23E8873A'/><text x='32' y='110' font-family='Helvetica,Arial,sans-serif' font-weight='900' font-size='60' fill='white' letter-spacing='-3'>BAKO</text><text x='148' y='110' font-family='Helvetica,Arial,sans-serif' font-weight='900' font-size='60' fill='%23E8873A'>.</text><text x='32' y='140' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='12' fill='%23E8873A' letter-spacing='3'>ATHLETE</text></svg>" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23111'/><circle cx='16' cy='16' r='6' fill='%23E8873A'/></svg>" />
<style>
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:#111; color:#fff; height:100%; width:100%; overflow:hidden; font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased; overscroll-behavior:none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#root { height:100vh; height:100dvh; }
button { -webkit-appearance:none; cursor:pointer; }
input, textarea, select { font-family:inherit; -webkit-appearance:none; border-radius:0; -webkit-user-select: text; user-select: text; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
input[type="number"] { -moz-appearance:textfield; }
::-webkit-scrollbar { display:none; }
* { -ms-overflow-style:none; scrollbar-width:none; }
.bako-splash { position:fixed; inset:0; background:#111; display:flex; align-items:center; justify-content:center; z-index:9999; }
.bako-splash-content { text-align:center; }
.bako-splash-bar { width:60px; height:4px; background:#E8873A; margin:0 auto 8px; border-radius:1px; }
.bako-splash-title { font-weight:900; font-size:36px; color:#fff; letter-spacing:-1px; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
.bako-splash-title .dot { color:#E8873A; }
.bako-splash-sub { font-family:-apple-system,BlinkMacSystemFont,monospace; font-size:9px; color:#E8873A; letter-spacing:0.25em; text-transform:uppercase; margin-top:8px; }
.bako-error { position:fixed; inset:16px; padding:16px; background:#1a0000; border:1px solid #f44336; border-radius:8px; color:#f44336; font-family:monospace; font-size:11px; overflow:auto; z-index:99999; display:none; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div id="root">
<div class="bako-splash"><div class="bako-splash-content"><div class="bako-splash-bar"></div><div class="bako-splash-title">BAKO<span class="dot">.</span></div><div class="bako-splash-sub">Athlete Program</div></div></div>
</div>
<pre id="error" class="bako-error"></pre>
<script>
window.addEventListener('error', function(e){
  var el=document.getElementById('error'); if(!el)return;
  el.style.display='block';

});
</script>
